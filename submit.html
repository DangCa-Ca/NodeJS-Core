                      <p class="text-muted">
                        Vui lòng nhập Số điện thoại và chúng tôi sẽ gửi đến bạn
                        một mã xác thực qua SMS.
                      </p>

                      <div class="form-check mb-4">
                        <label
                          class="form-check-label w-100"
                          for="recoverPhone"
                        >
                          <div class="d-flex gap-2 mt-2">
                            <select class="form-select" style="width: 100px">
                              <option value="+84">+84</option>
                              <option value="+1">+1</option>
                              <option value="+61">+61</option>
                              <!-- thêm nếu cần -->
                            </select>
                            <input
                              type="tel"
                              class="form-control"
                              placeholder="Số điện thoại ***********"
                              required
                            />
                          </div>
                        </label>
                      </div>
                      <div class="form-check mb-4">
                        <label class="form-check-label w-100" for="submit">

                            <input
                              type="tel"
                              class="form-control"
                              placeholder="Nhập mã xác thực"
                              required
                            />
                          </div>
                        </label>
                      </div>
