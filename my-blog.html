  <script>
    function renderPosts() {
      const tbody = document.getElementById('postTableBody');
      const empty = document.getElementById('emptyMsg');
      const posts = JSON.parse(localStorage.getItem('myPosts') || '[]');

      if (!posts.length) {
        empty.style.display = 'block';
        tbody.innerHTML = '';
        return;
      }
      empty.style.display = 'none';

      tbody.innerHTML = posts.map(p => `
    <tr>
      <td>${p.id}</td>
      <td>${p.author}</td>
      <td>${p.category}</td>
      <td>
        <a class="text-primary" data-bs-toggle="modal" data-bs-target="#postPreviewModal" onclick="preview(${p.id})">
          ${p.title}
        </a>
      </td>
      <td>${p.language}</td>
     <td>${p.origin_id == null ? 'Gốc' : 'Dịch'}</td>


      <td>${p.status == 1 ? 'Hoạt động' : 'Không hoạt động'}</td>
      <td>
        <div class="dropdown">
          <button class="btn btn-link p-0 m-0 border-0 text-muted" type="button" data-bs-toggle="dropdown" aria-expanded="false" style="font-size: 20px;">
            &#8942;
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="#" onclick="preview(${p.id})" data-bs-toggle="modal" data-bs-target="#postPreviewModal">View</a></li>
         <li><a class="dropdown-item" href="#" onclick="goToEdit(${p.id})">Edit</a></li>

            <li><a class="dropdown-item text-danger" href="#" onclick="deletePost(${p.id})">Delete</a></li>
          </ul>
        </div>
      </td>
    </tr>
  `).join('');
    }
    function goToEdit(id) {
      window.location.href = `update-post.html?id=${id}`;
    }

    function preview(id) {
      const post = (JSON.parse(localStorage.getItem('myPosts') || '[]')).find(x => x.id === id);
      if (!post) return alert('Không tìm thấy!');

      document.getElementById('previewContent').innerHTML = `
    <p><strong>Tiêu đề:</strong> ${post.title}</p>
   <p><strong>Mô tả:</strong> ${post.description?.trim() || '(Không có mô tả)'}</p>

    <p><strong>Nội dung:</strong></p>
    <div class="border rounded p-2 bg-light">${post.content || '(Không có nội dung)'}</div>
  `;
      // KHÔNG GỌI new bootstrap.Modal() ở đây nữa
    }




    function deletePost(id) {
      if (!confirm('Bạn có chắc chắn muốn xoá bài viết này?')) return;

      // Xoá khỏi myPosts
      let myPosts = JSON.parse(localStorage.getItem('myPosts') || '[]');
      myPosts = myPosts.filter(p => p.id !== id);
      localStorage.setItem('myPosts', JSON.stringify(myPosts));

      // Xoá khỏi published
      let published = JSON.parse(localStorage.getItem('published') || '[]');
      published = published.filter(p => p.id !== id);
      localStorage.setItem('published', JSON.stringify(published));

      renderPosts(); // Vẽ lại bảng sau khi xoá
    }
    renderPosts();

  </script>
  <script>
    const scrollContainer = document.querySelector("#categoryScroll");
    const btnScrollLeft = document.getElementById("btnScrollLeft");
    const btnScrollRight = document.getElementById("btnScrollRight");

    let currentOffset = 0;
    const visibleWidth = 600; // khớp với .category-scroll-inner-mask width

    function scrollCategories(direction) {
      const scrollAmount = 136 * direction; // item width + margin (120 + 16)
      const maxOffset = scrollContainer.scrollWidth - visibleWidth;

      currentOffset += scrollAmount;
      currentOffset = Math.max(0, Math.min(currentOffset, maxOffset));

      scrollContainer.style.transform = `translateX(${-currentOffset}px)`;
      updateButtons(maxOffset);
    }

    function updateButtons(maxOffset) {
      btnScrollLeft.style.display = currentOffset <= 0 ? "none" : "block";
      btnScrollRight.style.display = currentOffset >= maxOffset ? "none" : "block";
    }

    window.addEventListener("load", () => {
      updateButtons(scrollContainer.scrollWidth - visibleWidth);
    });

    window.addEventListener("resize", () => {
      updateButtons(scrollContainer.scrollWidth - visibleWidth);
    });
  </script>
  <script>

      event.preventDefault();
      const keyword = document.getElementById("searchInput").value.trim();
      if (keyword) {
        window.location.href = `search.html?keyword=${encodeURIComponent(keyword)}`;
      }
    }
  </script>
