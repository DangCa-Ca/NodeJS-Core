<script>
  let currentLang = 'vi';
  let contentData = {
    vi: { title: '', description: '', content: '' },
    en: { title: '', description: '', content: '' }
  };

  // Lấy editPostId
  const urlParams = new URLSearchParams(window.location.search);
  const editPostId = localStorage.getItem('editPostId') || urlParams.get('id');

  if (!editPostId) {
    alert('Không có ID bài viết!');
    window.location.href = 'post.html';
  }

  const myPosts = JSON.parse(localStorage.getItem('myPosts') || '[]');

  // Tìm post theo ID gốc (vi hoặc en)
  const postVi = myPosts.find(p => p.id == editPostId && p.language === 'vi');
  const postEn = myPosts.find(p => p.id == editPostId && p.language === 'en') ||
    myPosts.find(p => p.origin_id == postVi?.id && p.language === 'en');

  const postToEdit = postVi || postEn;

  if (!postToEdit) {
    alert('Không tìm thấy bài viết!');
    window.location.href = 'post.html';
  }

  // Thiết lập dữ liệu theo từng ngôn ngữ
  // 1. Lưu dữ liệu từng ngôn ngữ
  if (postVi) {
    contentData.vi = {
      title: postVi.title,
      description: postVi.description,
      content: postVi.content
    };
  }
  if (postEn) {
    contentData.en = {
      title: postEn.title,
      description: postEn.description,
      content: postEn.content
    };
  }

  // 2. Xác định ngôn ngữ đang sửa (ưu tiên theo postToEdit.language)
  currentLang = postToEdit.language || 'vi';

  // 3. Set UI theo ngôn ngữ hiện tại
  document.getElementById('language').value = currentLang;
  document.getElementById('category').value = postToEdit.category || '';
  document.getElementById('trangthai').value = postToEdit.status || '';


  function getCurrentInputs() {
    return {
      title: document.getElementById('title').value.trim(),
      description: document.getElementById('description').value.trim(),
      content: tinymce.get('contentEditor')?.getContent()?.trim() || ''
    };
  }

  function setInputs(data) {
    document.getElementById('title').value = data.title || '';
    document.getElementById('description').value = data.description || '';
    tinymce.get('contentEditor')?.setContent(data.content || '');
  }

  function editorSetup() {
    tinymce.init({
      selector: '#contentEditor',
      height: 600,
      setup: function (editor) {
        editor.on('init', function () {
          setInputs(contentData[currentLang]);
        });
        editor.on('NodeChange', function () {
          const imgs = editor.dom.select('img');
          imgs.forEach(img => {
            editor.dom.setStyle(img, 'max-width', '100%');
            editor.dom.setStyle(img, 'height', 'auto');
          });
        });
      }
    });
  }

  // Xử lý submit
  document.getElementById('postForm').addEventListener('submit', (e) => {
    e.preventDefault();
    contentData[currentLang] = getCurrentInputs();

    const category = document.getElementById('category').value;
    const status = document.getElementById('trangthai').value;
    const createdAt = postToEdit.createdAt || new Date().toISOString();

    // Tạo post mới đã sửa
    const updatedPost = {
      ...postToEdit,
      title: contentData[currentLang].title,
      description: contentData[currentLang].description,
      content: contentData[currentLang].content,
      category,
      status,
      language: currentLang,
      createdAt
    };

    // Xóa bản cũ, thêm bản mới vào đầu danh sách
    const updatedList = myPosts.filter(p => p.id !== postToEdit.id);
    updatedList.unshift(updatedPost);

    // Cập nhật localStorage
    localStorage.setItem('myPosts', JSON.stringify(updatedList));
    localStorage.setItem('post', JSON.stringify(updatedList.map(p => ({
      id: p.id,
      origin_id: p.origin_id,
      title: p.title,
      description: p.description,
      content: p.content,
      createdAt: p.createdAt
    }))));

    localStorage.removeItem('editPostId');
    window.location.href = 'post.html';
  });

  editorSetup();
</script>
