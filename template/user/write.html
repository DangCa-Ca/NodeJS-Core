  <!-- TinyMCE CDN -->

  <!-- kênh stable -->
  <script src="https://cdn.tiny.cloud/1/70dme6jtaubbdgcdg2eeiiz87tt8wq4nkgvtvuobarzj0vkx/tinymce/6/tinymce.min.js"
    referrerpolicy="origin"></script>



  <script>
    const titleInput = document.getElementById('post-title');
    const publishBtn = document.getElementById('publishBtn');
    const draftSavedMsg = document.getElementById('draftSavedMsg');

    // Lấy ID từ query nếu có (sửa nháp), còn không tạo mới
    let draftId = new URLSearchParams(location.search).get('id') || Date.now().toString();
    let saveTimer = null;

    /* ✅ Check xem có được phép Publish chưa */
    function checkInput() {
      const title = titleInput.value.trim();
      const editor = tinymce.get('post-content');
      const content = editor ? editor.getContent({ format: 'text' }).trim() : '';
      publishBtn.disabled = !(title && content);
    }

    /* ✅ Lưu nháp */
    function saveDraft() {
      const title = titleInput.value.trim();
      const content = tinymce.get('post-content')?.getContent() || '';
      if (!title || !content) return;

      const drafts = JSON.parse(localStorage.getItem('drafts') || '[]');
      const idx = drafts.findIndex(d => d.id === draftId);
      const now = new Date().toISOString();

      const draft = { id: draftId, title, content, savedAt: now };

      if (idx > -1) drafts[idx] = draft;
      else drafts.push(draft);

      localStorage.setItem('drafts', JSON.stringify(drafts));
      draftSavedMsg.style.display = 'inline';
      console.log('✅ Auto-saved draft');
    }

    /* ✅ Tự động lưu sau 1s không gõ */
    function debounceSave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveDraft, 1000);
    }

    /* ✅ Khởi tạo TinyMCE */
    tinymce.init({
      selector: '#post-content',
      plugins: 'lists link image code',
      toolbar: 'undo redo | formatselect | bold italic | alignleft aligncenter alignright | bullist numlist | image link | code',
      menubar: false,
      height: 480,
      automatic_uploads: true,

      file_picker_types: 'image',
      file_picker_callback: function (callback, value, meta) {
        if (meta.filetype === 'image') {
          const input = document.createElement('input');
          input.type = 'file';
          input.accept = 'image/*';
          input.onchange = function () {
            const file = this.files[0];
            const reader = new FileReader();
            reader.onload = function () {
              callback(reader.result, { alt: file.name });
            };
            reader.readAsDataURL(file);
          };
          input.click();
        }
      },

      images_upload_handler: function (blobInfo, success, failure) {
        const reader = new FileReader();
        reader.onload = () => success(reader.result);
        reader.onerror = () => failure("Không thể đọc ảnh");
        reader.readAsDataURL(blobInfo.blob());
      },

      setup: function (editor) {
        editor.on('input change undo redo paste', () => {
          debounceSave();
          checkInput();
        });
      },

      content_style: `
    img{max-width:100%;height:auto;display:block;margin:15px auto;}
    figcaption,em,small{font-size:14px;color:#555;text-align:center;display:block;margin-top:5px;}
  `
    });

    /* ✅ Lắng nghe title input */
    titleInput.addEventListener('input', () => {
      debounceSave();
      checkInput();
    });

    /* ✅ Khi bấm Publish */
    publishBtn.addEventListener('click', () => {
      saveDraft();  // đảm bảo lưu draft cuối cùng
      window.location.href = `create-post.html?id=${draftId}`;
    });
  </script>
