<!-- TinyMCE CDN -->
<!-- CDN có key -->
 <!-- kênh stable -->
<script src="https://cdn.tiny.cloud/1/70dme6jtaubbdgcdg2eeiiz87tt8wq4nkgvtvuobarzj0vkx/tinymce/6/tinymce.min.js" 
referrerpolicy="origin"></script>



<script>
  const titleInput = document.getElementById('post-title');
  const publishBtn = document.getElementById('publishBtn');

  function checkInput() {
    const title = titleInput.value.trim();
    const editor = tinymce.get('post-content');
    const content = editor ? editor.getContent({ format: 'text' }).trim() : '';
    publishBtn.disabled = !(title.length > 0 && content.length > 0);
  }

  titleInput.addEventListener('input', checkInput);

  tinymce.init({
    selector: '#post-content',
    plugins: 'lists link image code',
    toolbar: 'undo redo | formatselect | bold italic | alignleft aligncenter alignright | bullist numlist | image link | code',
    menubar: false,
    height: 480,
    automatic_uploads: true,

    // ✅ Cho phép chọn ảnh từ máy
    file_picker_types: 'image',
    file_picker_callback: function (callback, value, meta) {
      if (meta.filetype === 'image') {
        const input = document.createElement('input');
        input.setAttribute('type', 'file');
        input.setAttribute('accept', 'image/*');

        input.onchange = function () {
          const file = this.files[0];
          const reader = new FileReader();

          reader.onload = function () {
            callback(reader.result, {
              alt: file.name
            });
          };

          reader.readAsDataURL(file);
        };

        input.click();
      }
    },

    // ✅ Handler xử lý ảnh base64 (nếu có drag/drop hoặc paste)
    images_upload_handler: function (blobInfo, success, failure) {
      const reader = new FileReader();
      reader.onload = function () {
        success(reader.result);
      };
      reader.onerror = function () {
        failure("Không thể đọc ảnh");
      };
      reader.readAsDataURL(blobInfo.blob());
    },

    // ✅ Clean khi paste HTML từ ngoài
    paste_filter_drop: true,
    paste_preprocess: function (plugin, args) {
      const wrapper = document.createElement('div');
      wrapper.innerHTML = args.content;

      wrapper.querySelectorAll('noscript, script, style, iframe, link, svg').forEach(el => el.remove());
      wrapper.querySelectorAll('picture').forEach(pic => {
        const img = pic.querySelector('img');
        if (img) pic.replaceWith(img.cloneNode(true));
        else pic.remove();
      });
      wrapper.querySelectorAll('img').forEach(img => {
        if (img.dataset?.src) img.src = img.dataset.src;
        ['data-src', 'data-srcset', 'srcset', 'loading', 'style', 'width', 'height']
          .forEach(attr => img.removeAttribute(attr));
      });

      const seen = new Set();
      wrapper.querySelectorAll('img').forEach(img => {
        const key = img.src.split('?')[0];
        if (seen.has(key)) img.remove();
        else seen.add(key);
      });

      args.content = wrapper.innerHTML;
    },

    // ✅ Theo dõi thay đổi nội dung
    setup: function (editor) {
      editor.on('input change undo redo paste', () => checkInput());
    },

    // ✅ Style nội dung
    content_style: `
      img{max-width:100%;height:auto;display:block;margin:15px auto;}
      figcaption,em,small{font-size:14px;color:#555;text-align:center;display:block;margin-top:5px;}
    `
  });

  publishBtn.addEventListener('click', () => {
    window.location.href = 'stories.html';
  });
</script>
