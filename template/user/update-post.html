    <!-- TinyMCE CDN -->
    <!-- CDN có key -->


    <script src="tinymce/tinymce.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/editorjs-paste-parser@latest"></script>


    <script>
        let currentLang = 'vi';
        let contentData = { vi: {}, en: {} };

        // Lấy ID bài viết từ query
        const postId = new URLSearchParams(location.search).get('id');
        const myPosts = JSON.parse(localStorage.getItem('myPosts') || '[]');
        const postToEdit = myPosts.find(p => p.id == postId);

        if (!postToEdit) {
            alert('Bài viết không tồn tại!');
            window.location.href = 'my-blog.html';
        }

        // ✅ Lấy bài gốc và bài dịch dựa theo language và origin_id
        let postVi = null;
        let postEn = null;

        if (postToEdit.language === 'vi') {
            postVi = postToEdit;
            postEn = myPosts.find(p => p.origin_id == postVi.id && p.language === 'en');
        } else if (postToEdit.language === 'en') {
            postEn = postToEdit;
            postVi = myPosts.find(p => p.id == postEn.origin_id && p.language === 'vi');
        }

        // ✅ Gán vào contentData
        if (postVi) {
            contentData.vi = {
                title: postVi.title,
                description: postVi.description,
                content: postVi.content,
                category: postVi.category,
                status: postVi.status
            };
        }

        if (postEn) {
            contentData.en = {
                title: postEn.title,
                description: postEn.description,
                content: postEn.content,
                category: postEn.category,
                status: postEn.status
            };
        }

        // ✅ Ngôn ngữ đang sửa
        currentLang = postToEdit.language;

        window.addEventListener('DOMContentLoaded', () => {
            // Gán form inputs
            document.getElementById('language').value = currentLang;
            document.getElementById('category').value = contentData[currentLang].category;
            document.getElementById('status').value = contentData[currentLang].status;

            if (currentLang === 'en') {
                switchToEN();
            } else {
                switchToVI();
            }

            initEditor(currentLang);
        });

        // ✅ Nút chuyển tab ngôn ngữ
        document.getElementById('btn-vi').addEventListener('click', () => {
            if (currentLang !== 'vi') {
                saveCurrentInputs();
                currentLang = 'vi';
                switchToVI();
                reloadEditor(currentLang);
            }
        });

        document.getElementById('btn-en').addEventListener('click', () => {
            if (currentLang !== 'en') {
                saveCurrentInputs();
                currentLang = 'en';
                switchToEN();
                reloadEditor(currentLang);
            }
        });

        // ✅ Nút submit
        document.getElementById('postForm').addEventListener('submit', e => {
            e.preventDefault();
            saveCurrentInputs();

            let updatedPosts = myPosts.map(p => {
                if (p.id == postVi?.id) {
                    return { ...p, ...contentData.vi };
                }
                if (p.id == postEn?.id) {
                    return { ...p, ...contentData.en };
                }
                return p;
            });

            localStorage.setItem('myPosts', JSON.stringify(updatedPosts));
            alert('Cập nhật thành công!');
            window.location.href = 'my-blog.html';
        });

        // =======================
        // ✅ Các hàm tiện ích
        // =======================

        function saveCurrentInputs() {
            contentData[currentLang] = {
                title: document.getElementById('title').value.trim(),
                description: document.getElementById('description').value.trim(),
                content: tinymce.get('contentEditor')?.getContent()?.trim() || '',
                category: document.getElementById('category').value,
                status: document.getElementById('status').value
            };
        }

        function loadInputs(lang) {
            document.getElementById('title').value = contentData[lang]?.title || '';
            document.getElementById('description').value = contentData[lang]?.description || '';
            tinymce.get('contentEditor')?.setContent(contentData[lang]?.content || '');
            document.getElementById('language').value = lang;
            document.getElementById('category').value = contentData[lang]?.category || '';
            document.getElementById('status').value = contentData[lang]?.status || '';
        }

        function switchToVI() {
            document.getElementById('btn-vi').classList.replace('btn-outline-primary', 'btn-primary');
            document.getElementById('btn-en').classList.replace('btn-primary', 'btn-outline-secondary');
        }

        function switchToEN() {
            document.getElementById('btn-en').classList.replace('btn-outline-secondary', 'btn-primary');
            document.getElementById('btn-vi').classList.replace('btn-primary', 'btn-outline-primary');
        }

        function reloadEditor(lang) {
            tinymce.remove();
            setTimeout(() => initEditor(lang), 100);
        }

        function initEditor(lang) {
            tinymce.init({
                selector: '#contentEditor',
                height: 600,
                setup: function (editor) {
                    editor.on('init', function () {
                        loadInputs(lang);
                    });
                    editor.on('NodeChange', function () {
                        const imgs = editor.dom.select('img');
                        imgs.forEach(img => {
                            editor.dom.setStyle(img, 'max-width', '100%');
                            editor.dom.setStyle(img, 'height', 'auto');
                        });
                    });
                }
            });
        }
    </script>
