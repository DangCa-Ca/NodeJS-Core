<script src="tinymce/tinymce.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/editorjs-paste-parser@latest"></script>


<script>
let currentLang = 'vi';
let autoDraftId = new URLSearchParams(location.search).get('id') || Date.now().toString();
document.title = "Tạo bài viết";


function saveDraft() {
  const drafts = JSON.parse(localStorage.getItem('drafts') || '[]');
  const title = document.getElementById('title').value.trim();
  const description = document.getElementById('description').value.trim();
  const content = tinymce.get('contentEditor')?.getContent()?.trim() || '';

  const existingIndex = drafts.findIndex(d => d.id === autoDraftId && d.lang === currentLang);
  const existing = existingIndex >= 0 ? drafts[existingIndex] : null;

  const draftData = {
    id: autoDraftId,
    lang: currentLang,
    title,
    description,
    content,
    createdAt: existing?.createdAt || new Date().toISOString() // ✅ giữ thời gian cũ nếu đã có
  };

  if (existingIndex >= 0) drafts[existingIndex] = draftData;
  else drafts.push(draftData);

  localStorage.setItem('drafts', JSON.stringify(drafts));

  // ✅ Hiển thị "Draft Saved" trên header
  const msgEl = document.getElementById('draftSavedMsg');
  if (msgEl) msgEl.style.display = 'inline';
}



// ✅ Gắn auto-save khi người dùng gõ nội dung
['title', 'description'].forEach(id => {
  document.getElementById(id).addEventListener('input', saveDraft);
});

// ✅ Gắn auto-save cho nội dung TinyMCE
function editorSetup(lang) {
 tinymce.init({
  selector: '#contentEditor',
  height: 300,
  content_style: `
    img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 10px 0;
    }
    body {
      font-family: 'Segoe UI', sans-serif;
      font-size: 14px;
    }
  `,
  setup: function (editor) {
    editor.on('init', function () {
      const drafts = JSON.parse(localStorage.getItem('drafts') || '[]');
      const draft = drafts.find(d => d.id === autoDraftId && d.lang === currentLang);
      if (draft) {
        document.getElementById('title').value = draft.title || '';
        document.getElementById('description').value = draft.description || '';
        editor.setContent(draft.content || '');
      }
    });
    editor.on('Change KeyUp Paste', function () {
      saveDraft();
      });
    }
  });
}

// ✅ Khi chuyển ngôn ngữ
document.getElementById('btn-translate').addEventListener('click', () => {
  saveDraft();
  currentLang = 'en';

  // Chuyển giao diện
  document.getElementById('btn-vi').classList.remove('btn-primary');
  document.getElementById('btn-vi').classList.add('btn-outline-primary');
  document.getElementById('btn-en').classList.remove('btn-outline-secondary');
  document.getElementById('btn-en').classList.add('btn-primary');

  document.getElementById('title').value = '';
  document.getElementById('description').value = '';
  if (tinymce.get('contentEditor')) {
    tinymce.get('contentEditor').setContent('');
  }

  const languageSelect = document.getElementById('language');
  for (let option of languageSelect.options) {
    if (option.text === 'Tiếng Anh') {
      languageSelect.value = option.value;
      break;
    }
  }

  tinymce.remove();
  setTimeout(() => editorSetup('en'), 100);
});

// ✅ Submit
document.getElementById('postForm').addEventListener('submit', e => {
  e.preventDefault();
  saveDraft();

  const categoryEl = document.getElementById('category');
  const statusEl = document.getElementById('status');

  const drafts = JSON.parse(localStorage.getItem('drafts') || '[]');
  const viPost = drafts.find(d => d.id === autoDraftId && d.lang === 'vi');
  const enPost = drafts.find(d => d.id === autoDraftId && d.lang === 'en');

  const isValid = (p) => p && p.title && p.description && p.content;

  if (!isValid(viPost)) {
    alert('Vui lòng nhập đầy đủ thông tin tiếng Việt!');
    return;
  }

  const createdAt = new Date().toISOString();
  const postVi = {
    id: Date.now(),
    origin_id: null,
    author: 'Vũ Hải Đăng',
    category: categoryEl.value,
    language: 'vi',
    title: viPost.title,
    description: viPost.description,
    status: statusEl.value,
    content: viPost.content,
    createdAt
  };

  const postsToSave = [postVi];

  if (isValid(enPost)) {
    const postEn = {
      id: postVi.id + 1,
      origin_id: postVi.id,
      author: 'Vũ Hải Đăng',
      category: categoryEl.value,
      language: 'en',
      title: enPost.title,
      description: enPost.description,
      status: statusEl.value,
      content: enPost.content,
      createdAt
    };
    postsToSave.push(postEn);
  }

  const myPosts = JSON.parse(localStorage.getItem('myPosts') || '[]');
  const published = JSON.parse(localStorage.getItem('published') || '[]');

  for (let p of postsToSave) {
    myPosts.unshift(p);
    published.unshift({
      id: p.id,
      origin_id: p.origin_id,
      title: p.title,
      description: p.description,
      content: p.content,
      createdAt: p.createdAt
    });
  }

  localStorage.setItem('myPosts', JSON.stringify(myPosts));
  localStorage.setItem('published', JSON.stringify(published));

  const newDrafts = drafts.filter(d => d.id !== autoDraftId);
  localStorage.setItem('drafts', JSON.stringify(newDrafts));

  window.location.href = 'published.html';
});

// ✅ Khởi tạo lần đầu
editorSetup('vi');
</script>
