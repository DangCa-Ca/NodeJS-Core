<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit story</title>
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<style>
  body{font-family:Georgia,serif}
  .page-wrap{max-width:1100px;margin:auto;padding:40px 20px;display:flex;gap:40px}
  .left{flex:1 1 60%}
  .right{flex:1 1 40%}
  .preview-img{width:100%;height:220px;background:#f5f5f5
               ;display:flex;align-items:center;justify-content:center;color:#888;margin-bottom:24px}
  h1,h3{margin:0 0 12px}
  textarea{width:100%;min-height:80px}
</style>
</head>
<body>

<!-- simple navbar -->
<nav class="border-bottom p-2 d-flex justify-content-between">
  <button class="btn btn-link text-decoration-none"
          onclick="history.back()">✕</button>
  <span></span><!-- spacer -->
</nav>

<div class="page-wrap">

  <!-- LEFT : preview -->
  <div class="left">
    <h3>Story preview</h3>
    <div id="previewImg" class="preview-img">
      Include a high‑quality image
    </div>

    <h1 id="pTitle"></h1>
    <p id="pDesc" class="fs-5"></p>

    <p class="text-muted small mt-4">
      <strong>Note:</strong> Note: Changes here will affect how your story appears in public places like Medium’s 
      homepage and in subscribers’ inboxes — not the contents of the story itself.
    </p>
  </div>

  <!-- RIGHT : publish panel -->
  <div class="right">
    <h5>Publishing to: <strong>Hải Đăng</strong></h5>

    <label class="form-label mt-3">Add or change topics (up to 5) so readers know what your story is about</label>
    <input id="topics" class="form-control mb-3" placeholder="Add a topic..." />

    <div class="d-grid gap-2 mt-4">
      <button class="btn btn-success" id="publishBtn">Publish now</button>
      <button class="btn btn-outline-secondary" onclick="history.back()">Back to draft</button>
    </div>
  </div>

</div>



<script>
  /* ------------ LẤY DRAFT THEO ID --------------- */
  const params   = new URLSearchParams(location.search);
  const draftId  = params.get('id');
  const drafts   = JSON.parse(localStorage.getItem('drafts')||'[]');
  const draft    = drafts.find(d=>d.id===draftId);

  if(!draft){
    document.body.innerHTML='<p class="text-center mt-5">Không tìm thấy bản nháp!</p>';
    throw 'no‑draft';
  }

  /* ---- render preview ---- */
  document.getElementById('pTitle').innerText = draft.title;
  // đoạn description: lấy 120 kí tự đầu
  const plain = draft.content.replace(/<[^>]*>/g,'').trim();
  document.getElementById('pDesc').innerText =
      plain.slice(0,120)+(plain.length>120?'…':'');

  /* ------------ PUBLISH NOW ---------------------- */
  document.getElementById('publishBtn').onclick = ()=>{
    // 1. xoá khỏi drafts
    const newDrafts = drafts.filter(d=>d.id!==draftId);
    localStorage.setItem('drafts', JSON.stringify(newDrafts));

    // 2. thêm vào published
    const pub = JSON.parse(localStorage.getItem('published')||'[]');
    pub.unshift({
      id       : Date.now().toString(),
      title    : draft.title,
      desc     : plain.slice(0,160),
      content  : draft.content,
      topics   : document.getElementById('topics').value,
savedAt: new Date().toISOString()

    });
    localStorage.setItem('published', JSON.stringify(pub));

    // 3. chuyển trang
    location.href = 'published.html';
  };
</script>

</body>
</html>
