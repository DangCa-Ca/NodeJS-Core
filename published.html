<script>
  function formatTimeAgo(isoString) {
    const savedDate = new Date(isoString);
     if (isNaN(savedDate)) return 'Unknown time'; // 👈 Fix lỗi NaN
    const now = new Date();
    const diffMins = Math.floor((now - savedDate) / 60000);
    if (diffMins < 1) return "Just now";
    if (diffMins < 60) return `Published ${diffMins} minute${diffMins > 1 ? 's' : ''} ago`;
    const hours = Math.floor(diffMins / 60);
    return `Published ${hours} hour${hours > 1 ? 's' : ''} ago`;
  }

  function countWords(text) {
    return text.trim().split(/\s+/).filter(Boolean).length;
  }

  function renderPublishedList() {
    const publishedList = JSON.parse(localStorage.getItem('published') || '[]');
    const container = document.getElementById('publishedList');

    if (publishedList.length === 0) {
      container.innerHTML = '<p class="text-muted">No published stories yet.</p>';
      return;
    }

    let html = '';
      publishedList.forEach(post => {
        const plainText = post.content.replace(/<[^>]*>?/gm, '');
        const wordCount = countWords(plainText);
        const readTime = Math.max(1, Math.floor(wordCount / 200));

        html += `
        <div class="d-flex justify-content-between align-items-start border-bottom py-3">
          <div class="flex-grow-1">
            <h4 class="fw-bold mb-1">
              <a href="my-blog.html?id=${post.id}" class="text-decoration-none text-dark">${post.title}</a>
            </h4>
            <p class="mb-1 text-muted small">${plainText.slice(0, 100)}${plainText.length > 100 ? '...' : ''}</p>
            <div class="text-muted small">
              ${formatTimeAgo(post.createdAt)} · ${readTime} min read (${wordCount} words)
            </div>
          </div>
          <div class="dropdown ms-3">
            <a href="#" class="text-muted text-decoration-none" data-bs-toggle="dropdown" aria-expanded="false" style="font-size: 1.2rem;">⋮</a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="write.html?id=${post.id}">Edit</a></li>
              <li><button class="dropdown-item text-danger" onclick="deletePublished(${post.id})">Delete</button></li>
            </ul>
          </div>
        </div>`;
      });

      container.innerHTML = html;
    }

  function deletePublished(id) {
    if (!confirm('Bạn chắc chắn muốn xoá bài đã đăng này?')) return;
    const list = JSON.parse(localStorage.getItem('published') || '[]');
    const updatedList = list.filter(item => String(item.id) !== String(id));
    localStorage.setItem('published', JSON.stringify(updatedList));
    renderPublishedList();
    updateTabBadges();
  }

  function updateTabBadges() {
    const drafts = JSON.parse(localStorage.getItem('drafts') || '[]');
    const published = JSON.parse(localStorage.getItem('published') || '[]');
    const responses = JSON.parse(localStorage.getItem('responses') || '[]');

    document.getElementById('count-drafts').textContent = drafts.length;
    document.getElementById('count-published').textContent = published.length;
    document.getElementById('count-responses').textContent = responses.length;
  }

  renderPublishedList();
  updateTabBadges();
</script>
