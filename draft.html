  <script>
    function formatTimeAgo(isoString) {
      if (!isoString) return 'Unknown time';

      const savedDate = new Date(isoString);
      if (isNaN(savedDate.getTime())) return 'Unknown time';  // ✅ kiểm tra ngày không hợp lệ

      const now = new Date();
      const diffMins = Math.floor((now - savedDate) / 60000);

      if (diffMins < 1) return "Just now";
      if (diffMins < 60) return `Last edited ${diffMins} minute${diffMins > 1 ? 's' : ''} ago`;

      const hours = Math.floor(diffMins / 60);
      return `Last edited ${hours} hour${hours > 1 ? 's' : ''} ago`;
    }



    function countWords(text) {
      return text.trim().split(/\s+/).filter(Boolean).length;
    }

    /* ---------- XÓA 1 NHÁP ---------- */
    function deleteDraft(id) {
      if (!confirm('Bạn chắc chắn muốn xoá bản nháp này?')) return;

      const list = JSON.parse(localStorage.getItem('drafts') || '[]');
      const updatedList = list.filter(item => String(item.id) !== String(id));

      localStorage.setItem('drafts', JSON.stringify(updatedList));

      // Cập nhật lại số lượng hiển thị badge nếu có
      const badge = document.getElementById('draft-count');
      if (badge) badge.textContent = updatedList.length;

      renderDraftList();  // vẽ lại danh sách
    }


    function renderDraftList() {
      const draftList = JSON.parse(localStorage.getItem('drafts') || '[]');
      const container = document.getElementById('draftList');
      const badge = document.getElementById('draft-count');

      if (badge) badge.textContent = draftList.length;

      if (draftList.length === 0) {
        container.innerHTML = '<p class="text-muted">No drafts available.</p>';
        return;
      }

      let html = '';
      draftList.forEach(draft => {
        const plainText = draft.content.replace(/<[^>]*>?/gm, '');
        const wordCount = countWords(plainText);
        const readTime = Math.max(1, Math.floor(wordCount / 200));

        html += `
<div class="d-flex justify-content-between align-items-start border-bottom py-3">
  <div class="flex-grow-1">
    <h4 class="fw-bold mb-1">
      <a href="write.html?id=${draft.id}" class="text-decoration-none text-dark">${draft.title}</a>
    </h4>
    <p class="mb-1 text-muted small">${plainText.slice(0, 100)}${plainText.length > 100 ? '...' : ''}</p>
    <div class="text-muted small">
     ${formatTimeAgo(draft?.createdAt || draft?.savedAt)} · ${readTime} min read (${wordCount} words)
    </div>
  </div>
  <div class="dropdown ms-3">
    <a href="#" class="text-muted text-decoration-none" data-bs-toggle="dropdown" aria-expanded="false" style="font-size: 1.2rem;">⋮</a>
    <ul class="dropdown-menu dropdown-menu-end">
      <li><a class="dropdown-item" href="write.html?id=${draft.id}"> Edit draft </a></li>
      <li><button class="dropdown-item text-danger" onclick="deleteDraft(${draft.id})"> Delete draft </button></li>
    </ul>
  </div>
</div>`;


      });

      container.innerHTML = html;
    }


    renderDraftList();

  </script>

  <script>
    function loadAllComments() {
      const responses = [];
      const posts = JSON.parse(localStorage.getItem('published') || '[]');

      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('comments_post_')) {
          const postId = key.split('_').pop();
          const comments = JSON.parse(localStorage.getItem(key) || '[]');

          // Tìm post tương ứng (chuyển cả 2 về string để so)
          const post = posts.find(p => String(p.id) === String(postId));
          const postTitle = post ? post.title : '(Không tìm thấy bài viết)';

          comments.forEach(cmt => {
            responses.push({
              postId,
              postTitle,
              commentContent: cmt.content,
              commentTime: cmt.time
            });
          });
        }
      }

      return responses;
    }

    function updateTabBadges() {
      const drafts = JSON.parse(localStorage.getItem('drafts') || '[]');
      const published = JSON.parse(localStorage.getItem('published') || '[]');
      const responses = loadAllComments();

      document.getElementById('count-drafts').textContent = drafts.length;
      document.getElementById('count-published').textContent = published.length;
      document.getElementById('count-responses').textContent = responses.length;
    }

    renderDraftList();
    updateTabBadges();
  </script>
  <script>
    const scrollContainer = document.querySelector("#categoryScroll");
    const btnScrollLeft = document.getElementById("btnScrollLeft");
    const btnScrollRight = document.getElementById("btnScrollRight");

    let currentOffset = 0;
    const visibleWidth = 600; // khớp với .category-scroll-inner-mask width

    function scrollCategories(direction) {
      const scrollAmount = 136 * direction; // item width + margin (120 + 16)
      const maxOffset = scrollContainer.scrollWidth - visibleWidth;

      currentOffset += scrollAmount;
      currentOffset = Math.max(0, Math.min(currentOffset, maxOffset));

      scrollContainer.style.transform = `translateX(${-currentOffset}px)`;
      updateButtons(maxOffset);
    }

    function updateButtons(maxOffset) {
      btnScrollLeft.style.display = currentOffset <= 0 ? "none" : "block";
      btnScrollRight.style.display = currentOffset >= maxOffset ? "none" : "block";
    }

    window.addEventListener("load", () => {
      updateButtons(scrollContainer.scrollWidth - visibleWidth);
    });

    window.addEventListener("resize", () => {
      updateButtons(scrollContainer.scrollWidth - visibleWidth);
    });
  </script>
