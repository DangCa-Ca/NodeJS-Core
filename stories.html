<script>
  function updateTabBadges() {
    const drafts = JSON.parse(localStorage.getItem('drafts') || '[]');
    const published = JSON.parse(localStorage.getItem('published') || '[]');
    const responses = JSON.parse(localStorage.getItem('responses') || '[]');

    const draftCountEl = document.getElementById('count-drafts');
    const publishedCountEl = document.getElementById('count-published');
    const responseCountEl = document.getElementById('count-responses');

    if (draftCountEl) draftCountEl.textContent = drafts.length;
    if (publishedCountEl) publishedCountEl.textContent = published.length;
    if (responseCountEl) responseCountEl.textContent = responses.length;
  }

  updateTabBadges(); // Gọi ngay khi trang tải
</script>
