    <script src="https://cdn.tiny.cloud/1/70dme6jtaubbdgcdg2eeiiz87tt8wq4nkgvtvuobarzj0vkx/tinymce/6/tinymce.min.js"

    <script src="https://cdn.jsdelivr.net/npm/editorjs-paste-parser@latest"></script>


    <script>
        tinymce.init({
            selector: '#contentEditor',
            height: 400,
            menubar: false,
            plugins: 'lists link image table code',
            toolbar: 'undo redo | styles | bold italic underline | ' +
                'alignleft aligncenter alignright | bullist numlist | link image | code',
            branding: false,
            content_style: `
    img{max-width:100%!important;width:100%!important;height:auto!important;
    display:block;margin:1rem 0;object-fit:contain;}
  `,
  paste_preprocess: (_, args) => {
  const wrap = document.createElement('div');
  wrap.innerHTML = args.content;

  // 1. Bỏ thẻ rác
  wrap.querySelectorAll('noscript,script,style,iframe,link,svg')
      .forEach(el => el.remove());

  // 2. picture ➜ img (di chuyển, tránh clone)
  wrap.querySelectorAll('picture').forEach(pic => {
    const img = pic.querySelector('img');
    img ? pic.replaceWith(img) : pic.remove();
  });

  // 3. Chuẩn hoá src, xoá thuộc tính thừa
  wrap.querySelectorAll('img').forEach(img => {
    if (img.dataset?.src) img.src = img.dataset.src;      // lazy‑load
    ['data-src','data-srcset','srcset','loading',
     'style','width','height'].forEach(a => img.removeAttribute(a));
  });

  // 4. Giữ 1 ảnh/figure
  wrap.querySelectorAll('figure').forEach(fig => {
    fig.querySelectorAll('img').forEach((im,i) => { if (i) im.remove(); });
  });

  // 5. Xoá ảnh trùng theo tên file
  const seen = new Set();
  wrap.querySelectorAll('img').forEach(img => {
    try {
      const filename = new URL(img.src).pathname.split('/').pop().toLowerCase();
      if (seen.has(filename)) img.remove(); else seen.add(filename);
    } catch {}
  });

  args.content = wrap.innerHTML;
},
 setup: (editor) => {
    editor.on('init', () => {
      const draftId = new URLSearchParams(location.search).get('id');
      if (!draftId) return;

      const drafts = JSON.parse(localStorage.getItem('drafts') || '[]');
      const draft = drafts.find(d => d.id === draftId);
      if (!draft) return;

      // Gán title và content
      document.getElementById('title').value = draft.title || '';
      editor.setContent(draft.content || '');
    });
  }
  
});
        

        document.getElementById('postForm').addEventListener('submit', e => {
            e.preventDefault();

            const post = {
                id: Date.now(),
                author: 'Vũ Hải Đăng',
                category: category.value,
                language: language.value,
                title: title.value.trim(),
                desc: description.value.trim(),
                status: document.getElementById('status').value,

                content: tinymce.get('contentEditor').getContent(),
              createdAt: new Date().toISOString()
            };

            console.log(post); // Xem thử tất cả các giá trị người dùng nhập

if (
  !post.category ||
  !post.language ||
  !post.status ||
  !post.title ||
  !post.desc ||
  !post.content.trim()
) {
  alert('Vui lòng nhập đầy đủ thông tin!');
  return;
}
            const list = JSON.parse(localStorage.getItem('myPosts') || '[]');
            list.unshift(post);
            localStorage.setItem('myPosts', JSON.stringify(list));

     

const published = JSON.parse(localStorage.getItem('published') || '[]');
published.unshift({
  id         : post.id,
  title      : post.title,
  desc       : post.desc,
  content    : post.content,
createdAt: new Date().toISOString()
});
localStorage.setItem('published', JSON.stringify(published));

// ✅ Xóa bản nháp nếu có draftId trong URL
const draftId = new URLSearchParams(location.search).get('id');
if (draftId) {
  const drafts = JSON.parse(localStorage.getItem('drafts') || '[]');
  const newDrafts = drafts.filter(d => d.id !== draftId);
  localStorage.setItem('drafts', JSON.stringify(newDrafts));
}


  window.location.href = 'published.html';
        });
